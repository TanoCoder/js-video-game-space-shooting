  // Détecteur magique pour afficher les bugs directement sur l'écran du mobile
  window.onerror = function(message, source, lineno, colno, error) {
    const box = document.createElement('div');
    box.style = 'position:fixed;top:0;left:0;width:100%;background:red;color:white;z-index:9999;padding:10px;font-family:monospace;font-size:12px;word-break:break-all;';
    box.innerHTML = '🚨 BUG MOBILE : ' + message + '<br>Fichier : ' + source + '<br>Ligne : ' + lineno;
    document.body.appendChild(box);
    return false;
  };
</script>
