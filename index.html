<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <!-- Empêche le zoom et force la bonne taille sur smartphone -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Space Shooter 2D</title>
  
  <!-- Affiche votre vaisseau dans l'onglet du navigateur -->
  <link rel="icon" type="image/png" href="assets/img/hero.png">
  
  <!-- Liaison avec votre fichier CSS complet -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <div id="gameContainer">
    <!-- Votre balise Canvas avec l'ID utilisé par votre config.js -->
    <canvas id="canvas"></canvas>

    <!-- Votre bouton RUN avec l'ID utilisé par votre game.js (div_run) -->
    <div id="div_run" class="btn_run">
      <span id="run">RUN</span>
    </div>
  </div>


<script src="assets/js/game.js"></script></body>
</html>
